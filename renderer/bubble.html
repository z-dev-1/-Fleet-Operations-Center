<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:" />
  <title>Fleet Bubble</title>
  <style>
    /* ── Reset ────────────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 340px; height: 500px;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      color: #c9d1d9;
      -webkit-app-region: no-drag;
    }

    /* ── Shell ────────────────────────────────────────────────────────────── */
    #bubble-app {
      display: flex;
      flex-direction: column;
      height: 500px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    }

    /* ── Header ───────────────────────────────────────────────────────────── */
    .bubble-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px 9px;
      background: #0d1117;
      border-bottom: 1px solid #21262d;
      -webkit-app-region: drag;   /* drag handle */
      flex-shrink: 0;
    }
    .bubble-header__left  { display: flex; align-items: center; gap: 8px; }
    .bubble-title         { font-weight: 600; font-size: 13px; color: #e6edf3; letter-spacing: 0.3px; }

    .bubble-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      height: 20px;
      padding: 0 6px;
      background: #f0a800;
      color: #0d1117;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
    }
    .bubble-badge--zero { background: #21262d; color: #8b949e; }

    .bubble-sync-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #3fb950;
      flex-shrink: 0;
    }
    .bubble-sync-dot--stale { background: #f0a800; }
    .bubble-sync-dot--error { background: #f85149; }

    /* ── Body ─────────────────────────────────────────────────────────────── */
    .bubble-body {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 6px 0;
    }
    .bubble-body::-webkit-scrollbar { width: 4px; }
    .bubble-body::-webkit-scrollbar-track { background: transparent; }
    .bubble-body::-webkit-scrollbar-thumb { background: #30363d; border-radius: 2px; }

    /* ── Empty state ──────────────────────────────────────────────────────── */
    .bubble-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 6px;
      color: #484f58;
      font-size: 12px;
    }
    .bubble-empty__icon { font-size: 28px; opacity: 0.4; }

    /* ── Notification rows ────────────────────────────────────────────────── */
    .bubble-notif {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 14px;
      border-bottom: 1px solid #21262d;
      cursor: pointer;
      transition: background 0.1s;
      -webkit-app-region: no-drag;
    }
    .bubble-notif:hover         { background: #1c2128; }
    .bubble-notif:last-child    { border-bottom: none; }

    .bubble-notif__dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      margin-top: 4px;
      flex-shrink: 0;
    }
    .bubble-notif__dot--warn    { background: #f0a800; }
    .bubble-notif__dot--error   { background: #f85149; }
    .bubble-notif__dot--ok      { background: #3fb950; }
    .bubble-notif__dot--info    { background: #58a6ff; }

    .bubble-notif__content { flex: 1; min-width: 0; }
    .bubble-notif__unit {
      font-weight: 600;
      font-size: 12px;
      color: #e6edf3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bubble-notif__msg {
      font-size: 11px;
      color: #8b949e;
      margin-top: 2px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .bubble-notif__time {
      font-size: 10px;
      color: #484f58;
      white-space: nowrap;
      flex-shrink: 0;
      margin-top: 3px;
    }

    /* ── Unavailable unit rows (from fleet:data) ──────────────────────────── */
    .bubble-unit {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 14px;
      border-bottom: 1px solid #21262d;
      cursor: pointer;
      transition: background 0.1s;
      -webkit-app-region: no-drag;
    }
    .bubble-unit:hover      { background: #1c2128; }
    .bubble-unit:last-child { border-bottom: none; }

    .bubble-unit__id   { font-weight: 600; font-size: 12px; color: #e6edf3; }
    .bubble-unit__site { font-size: 11px; color: #8b949e; }
    .bubble-unit__state {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(248,81,73,0.15);
      color: #f85149;
      font-weight: 500;
    }

    /* ── Section label ────────────────────────────────────────────────────── */
    .bubble-section-label {
      padding: 6px 14px 3px;
      font-size: 10px;
      font-weight: 600;
      color: #484f58;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    /* ── Footer ───────────────────────────────────────────────────────────── */
    .bubble-footer {
      display: flex;
      gap: 8px;
      padding: 10px 14px;
      border-top: 1px solid #21262d;
      background: #0d1117;
      flex-shrink: 0;
      -webkit-app-region: no-drag;
    }
    .bubble-btn {
      flex: 1;
      padding: 6px 12px;
      border: 1px solid #30363d;
      border-radius: 6px;
      background: #21262d;
      color: #c9d1d9;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .bubble-btn:hover { background: #2d333b; border-color: #444c56; }
    .bubble-btn--primary {
      background: #f0a800;
      border-color: #f0a800;
      color: #0d1117;
      font-weight: 600;
    }
    .bubble-btn--primary:hover { background: #e09700; border-color: #e09700; }
  </style>
</head>
<body>
  <div id="bubble-app">

    <!-- Header -->
    <div class="bubble-header">
      <div class="bubble-header__left">
        <span class="bubble-title">Fleet Ops</span>
        <span id="bubble-sync-dot" class="bubble-sync-dot" title="Live"></span>
      </div>
      <span id="bubble-badge" class="bubble-badge bubble-badge--zero">0</span>
    </div>

    <!-- Body: notifications + unavailable units -->
    <div id="bubble-body" class="bubble-body">
      <div class="bubble-empty">
        <span class="bubble-empty__icon">&#x2714;&#xFE0F;</span>
        <span>All units nominal</span>
      </div>
    </div>

    <!-- Footer -->
    <div class="bubble-footer">
      <button id="bubble-open" class="bubble-btn bubble-btn--primary">Open Fleet</button>
      <button id="bubble-close" class="bubble-btn">Hide</button>
    </div>

  </div>

  <script>
    'use strict';

    // ── State ──────────────────────────────────────────────────────────────
    const MAX_NOTIFS = 20;
    const _notifs    = [];   // [{unit, message, type, ts}]
    let   _unavail   = [];   // [{id, domicileSite, lifecycleState}]
    let   _mode      = 'notifs';  // 'notifs' | 'units'

    // ── Element refs ────────────────────────────────────────────────────────
    const badgeEl  = document.getElementById('bubble-badge');
    const bodyEl   = document.getElementById('bubble-body');
    const dotEl    = document.getElementById('bubble-sync-dot');

    // ── Helpers ─────────────────────────────────────────────────────────────
    function _fmtTime(iso) {
      if (!iso) return '';
      const d   = new Date(iso);
      const now = new Date();
      const diffMs = now - d;
      if (diffMs < 60000)  return 'just now';
      if (diffMs < 3600000) return Math.floor(diffMs / 60000) + 'm ago';
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function _dotClass(type) {
      if (type === 'error')   return 'bubble-notif__dot--error';
      if (type === 'ok')      return 'bubble-notif__dot--ok';
      if (type === 'info')    return 'bubble-notif__dot--info';
      return 'bubble-notif__dot--warn';
    }

    function _setBadge(n) {
      badgeEl.textContent = n;
      if (n === 0) {
        badgeEl.className = 'bubble-badge bubble-badge--zero';
      } else {
        badgeEl.className = 'bubble-badge';
      }
    }

    // ── Render ───────────────────────────────────────────────────────────────
    function _render() {
      const hasNotifs  = _notifs.length  > 0;
      const hasUnavail = _unavail.length > 0;

      if (!hasNotifs && !hasUnavail) {
        bodyEl.innerHTML =
          '<div class="bubble-empty">' +
          '<span class="bubble-empty__icon">&#x2714;&#xFE0F;</span>' +
          '<span>All units nominal</span>' +
          '</div>';
        return;
      }

      let html = '';

      // Notifications section
      if (hasNotifs) {
        html += '<div class="bubble-section-label">Alerts</div>';
        _notifs.forEach((n) => {
          const dotCls = _dotClass(n.type);
          html +=
            '<div class="bubble-notif" data-unit="' + (n.unit || '') + '">' +
              '<span class="bubble-notif__dot ' + dotCls + '"></span>' +
              '<div class="bubble-notif__content">' +
                '<div class="bubble-notif__unit">' + _esc(n.unit || 'Fleet') + '</div>' +
                '<div class="bubble-notif__msg">'  + _esc(n.message || '') + '</div>' +
              '</div>' +
              '<span class="bubble-notif__time">' + _fmtTime(n.ts) + '</span>' +
            '</div>';
        });
      }

      // Unavailable units section
      if (hasUnavail) {
        html += '<div class="bubble-section-label">Unavailable (' + _unavail.length + ')</div>';
        _unavail.forEach((u) => {
          html +=
            '<div class="bubble-unit" data-unit="' + _esc(u.id || '') + '">' +
              '<div>' +
                '<div class="bubble-unit__id">'   + _esc(u.id || '?') + '</div>' +
                '<div class="bubble-unit__site">' + _esc(u.domicileSite || '') + '</div>' +
              '</div>' +
              '<span class="bubble-unit__state">Unavailable</span>' +
            '</div>';
        });
      }

      bodyEl.innerHTML = html;

      // Wire click handlers (event delegation would be cleaner but innerHTML is fine here)
      bodyEl.querySelectorAll('[data-unit]').forEach((el) => {
        const unitId = el.dataset.unit;
        if (unitId) {
          el.addEventListener('click', () => window.bubble.openUnit(unitId));
        }
      });
    }

    function _esc(str) {
      return String(str)
        .replace(/&/g,  '&amp;')
        .replace(/</g,  '&lt;')
        .replace(/>/g,  '&gt;')
        .replace(/"/g,  '&quot;');
    }

    // ── IPC listeners ────────────────────────────────────────────────────────

    // Direct badge push from main (sync complete, count known immediately)
    window.bubble.onBadge((count) => {
      _setBadge(typeof count === 'number' ? count : 0);
      dotEl.className = 'bubble-sync-dot';
    });

    // Push notification (status change, risk alert, etc.)
    window.bubble.onNotification((notif) => {
      _notifs.unshift({
        unit:    notif.unit    || '',
        message: notif.message || '',
        type:    notif.type    || 'warn',
        ts:      notif.ts      || new Date().toISOString(),
      });
      if (_notifs.length > MAX_NOTIFS) _notifs.length = MAX_NOTIFS;
      _render();
    });

    // Full fleet data push (extract unavailable list + recompute badge)
    window.bubble.onFleetData((data) => {
      const rows = data.rows || [];
      _unavail = rows
        .filter((r) => /unavailable/i.test(r.atsState || r.lifecycleState || ''))
        .map((r) => ({ id: r.id, domicileSite: r.domicileSite, lifecycleState: r.lifecycleState || r.atsState }));
      _setBadge(_unavail.length);
      dotEl.className = 'bubble-sync-dot';
      _render();
    });

    // ── Button handlers ──────────────────────────────────────────────────────
    document.getElementById('bubble-open').addEventListener('click', () => {
      window.bubble.openMain();
    });

    document.getElementById('bubble-close').addEventListener('click', () => {
      window.bubble.openMain();
    });
  </script>
</body>
</html>
